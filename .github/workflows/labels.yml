name: Dependabot labels

"on":
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/labels.yml
      - scripts/ensure-github-labels.sh
      - tests/labels.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - run: ./tests/labels.sh

  reconcile:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Bootstrap configured labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/ensure-github-labels.sh
