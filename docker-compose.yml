name: hidden-git

services:
  soft-serve:
    build:
      context: .
      dockerfile: Dockerfile.soft-serve
      args:
        GO_IMAGE: ${GO_IMAGE}
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
        SOFT_SERVE_VERSION: ${SOFT_SERVE_VERSION}
    environment:
      SOFT_SERVE_DATA_PATH: ${SOFT_SERVE_DATA_PATH}
      SOFT_SERVE_NAME: ${SOFT_SERVE_NAME:-HiddenGit}
      SOFT_SERVE_INITIAL_ADMIN_KEYS: ${SOFT_SERVE_INITIAL_ADMIN_KEYS}
      SOFT_SERVE_SSH_PORT: ${SOFT_SERVE_SSH_PORT}
      SOFT_SERVE_HTTP_PORT: ${SOFT_SERVE_HTTP_PORT}
      SOFT_SERVE_STATS_PORT: ${SOFT_SERVE_STATS_PORT}
      SOFT_SERVE_GIT_PORT: ${SOFT_SERVE_GIT_PORT}
      SOFT_SERVE_SSH_PUBLIC_URL: ${SOFT_SERVE_SSH_PUBLIC_URL:-}
      SOFT_SERVE_HTTP_PUBLIC_URL: ${SOFT_SERVE_HTTP_PUBLIC_URL:-}
      SOFT_SERVE_GIT_PUBLIC_URL: ${SOFT_SERVE_GIT_PUBLIC_URL:-}
      CI: ${CI}
    volumes:
      - ./data/soft-serve:${SOFT_SERVE_DATA_PATH}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SOFT_SERVE_SSH_PORT}:${SOFT_SERVE_SSH_PORT}"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SOFT_SERVE_HTTP_PORT}:${SOFT_SERVE_HTTP_PORT}"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SOFT_SERVE_STATS_PORT}:${SOFT_SERVE_STATS_PORT}"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SOFT_SERVE_GIT_PORT}:${SOFT_SERVE_GIT_PORT}"
    expose:
      - "${SOFT_SERVE_SSH_PORT}"
    networks:
      - soft-serve-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ssh-keyscan -T 3 -p "$${SOFT_SERVE_SSH_PORT}" 127.0.0.1
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
    environment:
      ONION_PUBLIC_PORT: ${ONION_PUBLIC_PORT}
      ONION_TARGET_PORT: ${ONION_TARGET_PORT}
    volumes:
      - ./data/tor:/var/lib/tor
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - soft-serve-net
    depends_on:
      soft-serve:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  soft-serve-net:
    driver: bridge
