services:
  tor-check:
    build:
      context: .
      dockerfile: Dockerfile.tor-check
      args:
        DEBIAN_IMAGE: ${DEBIAN_IMAGE}
    network_mode: "service:tor"
    depends_on:
      tor:
        condition: service_started
    environment:
      ONION_PUBLIC_PORT: ${ONION_PUBLIC_PORT}
      SOFT_SERVE_SSH_USER: ${SOFT_SERVE_SSH_USER}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-180}
    volumes:
      - ./data/tor:/var/lib/tor:ro
    profiles: ["check"]
