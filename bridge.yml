version: 1
name: hidden-git
description: Soft Serve Git forge exposed through a Tor onion service
commands:
  test:
    run: ["./tests/test.sh"]
    description: Run static release checks
    category: test
    timeoutMs: 120000
  evidence:
    run: ["./run.sh", "evidence", "release-evidence"]
    description: Generate release provenance, SBOMs, and vulnerability reports
    category: build
    timeoutMs: 2700000
  e2e:
    run: ["./tests/e2e.sh"]
    description: Run an isolated fresh-deployment onion SSH integration test
    category: test
    timeoutMs: 600000
  backup-restore:
    run: ["./tests/backup-restore.sh"]
    description: Test encrypted backups and both restore identity modes
    category: test
    timeoutMs: 300000
  rootless-docker:
    run: ["./tests/rootless-docker.sh"]
    description: Validate the stack against a disposable rootless Docker daemon
    category: test
    timeoutMs: 1800000
  non-root-migration:
    run: ["./tests/non-root-migration.sh"]
    description: Test the idempotent stable-UID ownership migration
    category: test
    timeoutMs: 300000
  doctor:
    run: ["./run.sh", "doctor", "--strict"]
    description: Run the strict operator best-practice audit
    category: lint
    timeoutMs: 120000
  config:
    run: ["./run.sh", "config"]
    description: Render and validate the Docker Compose configuration
    category: lint
    timeoutMs: 30000
  build:
    run: ["./run.sh", "build"]
    description: Build all release images
    category: build
    timeoutMs: 900000
agent:
  notes: >-
    Never commit .env, Soft Serve databases or SSH keys, or Tor hidden-service
    state. VERSION is the canonical project version.
  tasks:
    - Keep CHANGELOG.md and VERSION aligned for every release.
  changelog:
    - Prepared release 0.0.3 with reconciled state, Alpine runtimes, strict
      vulnerability gating, rootless Docker coverage, and MIT licensing.
    - Prepared release 0.0.2 with managed configuration, finite checks, tests,
      safer host bindings, and repository secret hygiene.

