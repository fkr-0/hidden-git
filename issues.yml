issues:
  - id: HG-001
    title: Run both service containers as dedicated non-root users
    status: closed
    priority: high
    area: security
    reason_deferred: >-
      Existing bind-mounted Soft Serve and Tor state may be root-owned or owned
      by distribution-specific numeric users. A safe change needs an explicit
      ownership migration and rollback path to avoid making existing instances
      unbootable.
    acceptance_criteria:
      - Document stable UID/GID assignments.
      - Provide an idempotent ownership migration command.
      - Verify fresh and upgraded deployments with rootless Docker or Podman.
    progress:
      - Doctor reports daemon and container-user posture with remediation.
      - An idempotent permission repair command protects current bind mounts.
      - Stable UIDs 10001 and 10002 and an idempotent ownership migration are implemented.
      - Services run non-root with read-only roots, dropped capabilities, and no-new-privileges.
      - Fresh and upgraded disposable deployments are covered by integration tests.
      - A digest-pinned rootless Docker daemon test validates Compose builds,
        service ownership, stable UIDs, read-only roots, and dropped capabilities.
    resolution: >-
      Soft Serve and Tor run as UIDs 10001 and 10002 with read-only roots,
      no-new-privileges, and all capabilities dropped. Existing state has an
      explicit idempotent migration and encrypted rollback path. A disposable
      official rootless Docker daemon now verifies the full bind-mount and
      Compose deployment path in CI-compatible integration tests.
    closed_at: 2026-07-18

  - id: HG-010
    title: Modularize the operator CLI without changing its public contract
    status: open
    priority: medium
    area: maintainability
    reason_deferred: >-
      The single entry point keeps operations discoverable, but run.sh now
      combines configuration, runtime, connectivity, backup, migration, and
      release responsibilities. Decomposition must preserve command names,
      exit statuses, failure ordering, and secret-handling behavior.
    acceptance_criteria:
      - Split command families into small sourced libraries with explicit APIs.
      - Preserve every documented command and exit-status contract.
      - Add Docker-free unit fixtures for parsing and guard behavior.
      - Keep shellcheck, integration, migration, and recovery tests passing.

  - id: HG-011
    title: Define a versioned configuration schema and upgrade contract
    status: closed
    priority: medium
    area: compatibility
    reason_deferred: >-
      Existing defaults preserve older environment files, but the project does
      not yet have a machine-readable schema that distinguishes deprecated,
      removed, unknown, deployment-specific, and release-managed values.
    acceptance_criteria:
      - Publish a versioned schema for supported environment values.
      - Detect unknown, removed, renamed, and invalid values with remediation.
      - Test upgrades from representative prior release configurations.
      - Document compatibility and rollback policy for pre-1.0 releases.
    resolution: >-
      HiddenGit 0.1.0 introduces HIDDEN_GIT_CONFIG_VERSION=1 and a
      machine-readable schema, rejects duplicate and unknown current keys,
      provides secret-safe preview-first legacy migration with an atomic private
      rollback copy, preserves legacy custom SSH host-port intent while fixing
      internal topology, and verifies exact second-apply idempotency with
      representative upgrade fixtures.
    closed_at: 2026-08-27

  - id: HG-012
    title: Automate off-host backup verification and recovery drills
    status: open
    priority: high
    area: operations
    reason_deferred: >-
      Backup and restore are tested in disposable fixtures, but operational
      confidence also requires recurring verification of real encrypted
      archives, off-host storage, freshness objectives, and full recovery
      drills that do not expose the offline identity.
    acceptance_criteria:
      - Add a non-interactive, secret-safe verification command for timers.
      - Define backup freshness and retention objectives.
      - Document off-host archive and offline identity storage.
      - Produce machine-readable drill evidence without secret material.
      - Exercise preserve and rotate recovery modes in an isolated full stack.

  - id: HG-002
    title: Add encrypted backup, restore, and onion identity rotation workflows
    status: closed
    priority: high
    area: operations
    reason_deferred: >-
      Reliable backup requires coordinated Soft Serve database snapshots,
      repository storage, SSH host keys, and a policy decision about whether the
      Tor onion identity should be preserved or rotated.
    acceptance_criteria:
      - Produce encrypted, integrity-checked backups.
      - Test restore into an empty deployment.
      - Support explicit preserve-identity and rotate-identity modes.
    resolution: >-
      Added a pinned maintenance image with age encryption, authenticated
      archives, internal per-file SHA-256 verification, stopped-stack safety,
      empty-target restores, and explicit preserve or rotate onion identity
      modes. A containerized regression test exercises both restore paths.
    closed_at: 2026-07-18

  - id: HG-008
    title: Reduce and continuously triage high and critical image vulnerabilities
    status: closed
    priority: high
    area: security
    evidence:
      observed_at: 2026-07-18
      scanner: trivy-0.72.0
      policy: strict-fail-on-any-high-or-critical
      images:
        soft-serve:
          critical: 0
          high: 0
          fixable_high_or_critical: 0
        tor:
          critical: 0
          high: 0
          fixable_high_or_critical: 0
        tor-check:
          critical: 0
          high: 0
          fixable_high_or_critical: 0
        maintenance:
          critical: 0
          high: 0
          fixable_high_or_critical: 0
    reason_deferred: >-
      The first complete evidence pass found no remaining high or critical
      finding with an advertised fixed version after applying explicit Soft
      Serve dependency overrides and removing the unused OpenSSH client. The
      remaining findings are currently unfixed distro or embedded dependency
      advisories. Their exposure and package necessity still require explicit
      per-image review and image-minimization work.
    acceptance_criteria:
      - Generate and review evidence for every release image.
      - Fail release evidence when a high or critical fixed version is available.
      - Document exploitability and compensating controls for unfixed findings.
      - Remove unnecessary packages or replace the base where materially safer.
      - Close or explicitly accept each remaining critical finding.
    progress:
      - The evidence pipeline records all findings and gates fixable high or critical issues.
      - Strict mode can reject any high or critical finding for hardened releases.
      - Sixteen fixable Soft Serve dependency findings were remediated downstream.
      - The unused OpenSSH client was removed from the Soft Serve runtime image.
      - All four release runtimes moved to a digest-pinned Alpine 3.23 base.
      - Strict final evidence reports zero high or critical findings in every image.
    resolution: >-
      Replaced the Debian runtimes with minimal Alpine 3.23 images, retained the
      explicit fixed Soft Serve Go dependency overrides, and removed unused
      packages. Trivy 0.72.0 strict evidence now reports zero HIGH and zero
      CRITICAL findings for Soft Serve, Tor, the checker, and maintenance.
      Release evidence defaults to strict rejection of any future finding at
      either severity.
    closed_at: 2026-07-18

  - id: HG-009
    title: Reconcile distinct current and legacy deployment state directories
    status: closed
    priority: high
    area: operations
    evidence:
      observed_at: 2026-07-18
      current_layout: data/
      legacy_layouts:
        - soft-serve-data/
        - tor-data/
      distinct_database: true
      distinct_ssh_host_identity: true
      distinct_onion_identity: true
    reason_deferred: >-
      The checkout contains two distinct deployments rather than duplicate
      directories. Automatically selecting, merging, or deleting either state
      could lose repositories or permanently change an onion address. A safe
      resolution requires operator intent and verified backups of both states.
    acceptance_criteria:
      - Create and restore-test encrypted backups of both deployment layouts.
      - Decide which database and onion identity is authoritative.
      - Export or migrate repositories that exist only in the non-authoritative state.
      - Archive or securely remove the retired deployment after verification.
    progress:
      - Doctor warns when both layouts coexist.
      - A secret-safe legacy-state command reports counts, recency, and equality only.
    resolution: >-
      Secret-safe SQLite inventory confirmed that neither deployment contained
      repositories, keys, collaborators, or LFS objects. The configured and
      newer data/ layout was selected as authoritative. Both layouts were
      encrypted with age and independently decrypt-and-manifest verified; the
      legacy state was moved intact below retired-state/ with a reconciliation
      report, and current state was migrated to the dedicated service UIDs.
    closed_at: 2026-07-18

  - id: HG-003
    title: Support Tor v3 client authorization
    status: open
    priority: medium
    area: privacy
    reason_deferred: >-
      Client authorization changes onboarding, secret distribution, revocation,
      and recovery semantics and therefore needs a designed operator workflow.
    acceptance_criteria:
      - Add and revoke authorized clients without rebuilding images.
      - Keep client credentials outside version control.
      - Document multi-device recovery and rotation.

  - id: HG-004
    title: Add CI with real container and Tor integration coverage
    status: closed
    priority: medium
    area: testing
    reason_deferred: >-
      Static checks are deterministic locally, while a real onion bootstrap test
      depends on Docker privileges, external Tor network availability, and a
      longer CI timeout budget.
    acceptance_criteria:
      - Build all images in CI.
      - Start a fresh stack with an ephemeral administrator key.
      - Verify SSH reachability over the generated onion address.
      - Preserve useful container logs on failure.
    resolution: >-
      Added GitHub Actions jobs for static checks, all-image builds, and the
      isolated authenticated onion SSH integration harness. Failed E2E runs
      retain and upload the disposable test workspace and Compose logs.
    closed_at: 2026-07-18

