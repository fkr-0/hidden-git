    status: closed
    priority: medium
    area: supply-chain
    reason_deferred: >-
      Digest pinning improves reproducibility but requires an automated process
      to refresh architecture-specific digests and review security updates.
    acceptance_criteria:
      - Pin all release images by reviewed multi-architecture digest.
      - Add an automated update proposal workflow.
      - Record provenance and vulnerability-scan output for releases.
    progress:
      - Debian and Go release image references are pinned by OCI index digest.
      - Dependabot is configured for Docker and GitHub Actions updates.
      - Release provenance and vulnerability scan artifacts are generated for tags.
    resolution: >-
      Added digest-pinned base and scanner images, immutable GitHub Action
      references, automated dependency proposals, SLSA v1 provenance extraction,
      CycloneDX SBOM generation, and vulnerability reports uploaded for tagged
      releases and manual evidence runs.
    closed_at: 2026-07-18

  - id: HG-006
    title: Select and publish a project license
    status: open
    priority: medium
    area: governance
    reason_deferred: >-
      Choosing a license changes the legal permissions granted to downstream
      users and cannot be inferred safely from the source tree.
    acceptance_criteria:
      - Record the maintainer's explicit license choice.
      - Add the canonical license text at the repository root.
      - Reference the license from the README and release metadata.

  - id: HG-007
    title: Add actionable operator UX for security best-practice violations
    status: closed
    priority: high
    area: usability
    acceptance_criteria:
      - Distinguish invalid configuration from risky but valid choices.
      - Give a concrete remediation for every warning.
      - Provide strict automation mode and safe permission repair.
      - Surface connection commands and remaining issue priorities.
    resolution: >-
      Doctor now emits PASS, WARN, FAIL, and INFO findings with fixes, supports
